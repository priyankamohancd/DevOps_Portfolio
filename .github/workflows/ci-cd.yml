# .github/workflows/ci-cd.yml
# This is the CI/CD pipeline. GitHub Actions runs it automatically on every push.
#
# Pipeline stages:
#   1. lint   - check code style
#   2. test   - run unit tests
#   3. build  - build Docker image
#   4. scan   - security-scan the image
#   5. deploy - deploy locally via self-hosted runner (or simulate)

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------- STAGE 1: LINT ----------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ --max-line-length=100 --exclude=__pycache__

  # ---------- STAGE 2: TEST ----------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run pytest
        working-directory: ./app
        run: pytest -v --tb=short

  # ---------- STAGE 3: BUILD IMAGE ----------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                       # don't push to registry in demo
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true                        # load into local Docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------- STAGE 4: SECURITY SCAN ----------
  scan:
    name: Scan Image for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0          # set to 1 to fail the build on findings

  # ---------- STAGE 5: DEPLOY (LOCAL) ----------
  # In a real classroom: run this job on a self-hosted runner on the
  # instructor's machine, so the container actually lands locally.
  # For demo purposes here we just verify the container starts.
  deploy:
    name: Deploy Locally
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Tag image as latest
        run: docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest

      - name: Run container
        run: docker run -d --name app -p 5000:5000 ${{ env.IMAGE_NAME }}:latest

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/

      - name: Show running containers
        run: docker ps
