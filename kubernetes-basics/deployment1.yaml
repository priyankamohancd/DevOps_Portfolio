apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-config-demo
  namespace: my-first-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-config-demo
  template:
    metadata:
      labels:
        app: nginx-config-demo
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
